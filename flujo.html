<!DOCTYPE html>
<html>
<head>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans, sans-serif); background: transparent; }

.diagram-wrap { padding: 16px 0 24px; }

.legend {
  display: flex; flex-wrap: wrap; gap: 10px;
  padding: 10px 16px 16px;
}
.legend-item {
  display: flex; align-items: center; gap: 6px;
  font-size: 11px; color: var(--color-text-secondary);
}
.legend-dot {
  width: 12px; height: 12px; border-radius: 2px; flex-shrink: 0;
}

svg text { font-family: var(--font-sans, sans-serif); }

.node-btn {
  cursor: pointer;
  transition: opacity 0.15s;
}
.node-btn:hover { opacity: 0.82; }

.tooltip {
  position: fixed;
  background: var(--color-background-primary);
  border: 1px solid var(--color-border-primary);
  border-radius: 6px;
  padding: 7px 11px;
  font-size: 12px;
  color: var(--color-text-secondary);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.15s;
  max-width: 220px;
  z-index: 100;
  line-height: 1.5;
}
.tooltip.visible { opacity: 1; }
</style>
</head>
<body>
<div class="diagram-wrap">

<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:#185FA5"></div> Acciones del usuario</div>
  <div class="legend-item"><div class="legend-dot" style="background:#0F6E56"></div> Aprobación manual</div>
  <div class="legend-item"><div class="legend-dot" style="background:#3B6D11"></div> Inventario</div>
  <div class="legend-item"><div class="legend-dot" style="background:#854F0B"></div> Solicitud de compra</div>
  <div class="legend-item"><div class="legend-dot" style="background:#A32D2D"></div> Cancelación</div>
  <div class="legend-item"><div class="legend-dot" style="background:#5F5E5A"></div> Estado / transición</div>
</div>

<svg width="100%" viewBox="0 0 680 1480" role="img">
  <title>Diagrama de flujo del sistema de control de reportes</title>
  <desc>Flujo completo desde la creación de una orden de servicio hasta el cierre, incluyendo contraste de materiales y solicitud de compra.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ══════════════════════════════════════════════
       COLUMNA IZQUIERDA: etiquetas de fase
  ══════════════════════════════════════════════ -->

  <!-- Fase 1 -->
  <rect x="10" y="28" width="88" height="120" rx="4" fill="#E6F1FB" stroke="#B5D4F4" stroke-width="0.5"/>
  <text x="54" y="72" text-anchor="middle" font-size="11" font-weight="500" fill="#0C447C">Fase 1</text>
  <text x="54" y="88" text-anchor="middle" font-size="10" fill="#185FA5">Creación</text>
  <text x="54" y="102" text-anchor="middle" font-size="10" fill="#185FA5">de orden</text>

  <!-- Fase 2 -->
  <rect x="10" y="200" width="88" height="100" rx="4" fill="#E1F5EE" stroke="#9FE1CB" stroke-width="0.5"/>
  <text x="54" y="240" text-anchor="middle" font-size="11" font-weight="500" fill="#085041">Fase 2</text>
  <text x="54" y="256" text-anchor="middle" font-size="10" fill="#0F6E56">Validación</text>
  <text x="54" y="270" text-anchor="middle" font-size="10" fill="#0F6E56">manual</text>

  <!-- Fase 3 -->
  <rect x="10" y="352" width="88" height="160" rx="4" fill="#EAF3DE" stroke="#C0DD97" stroke-width="0.5"/>
  <text x="54" y="392" text-anchor="middle" font-size="11" font-weight="500" fill="#27500A">Fase 3</text>
  <text x="54" y="408" text-anchor="middle" font-size="10" fill="#3B6D11">Contraste</text>
  <text x="54" y="422" text-anchor="middle" font-size="10" fill="#3B6D11">de</text>
  <text x="54" y="436" text-anchor="middle" font-size="10" fill="#3B6D11">materiales</text>

  <!-- Fase 4A -->
  <rect x="10" y="564" width="88" height="120" rx="4" fill="#FAEEDA" stroke="#FAC775" stroke-width="0.5"/>
  <text x="54" y="604" text-anchor="middle" font-size="11" font-weight="500" fill="#633806">Fase 4A</text>
  <text x="54" y="620" text-anchor="middle" font-size="10" fill="#854F0B">Sin</text>
  <text x="54" y="634" text-anchor="middle" font-size="10" fill="#854F0B">faltantes</text>
  <text x="54" y="648" text-anchor="middle" font-size="10" fill="#854F0B">→ ejecutar</text>

  <!-- Fase 4B -->
  <rect x="10" y="736" width="88" height="360" rx="4" fill="#FAECE7" stroke="#F5C4B3" stroke-width="0.5"/>
  <text x="54" y="780" text-anchor="middle" font-size="11" font-weight="500" fill="#4A1B0C">Fase 4B</text>
  <text x="54" y="796" text-anchor="middle" font-size="10" fill="#993C1D">Con</text>
  <text x="54" y="810" text-anchor="middle" font-size="10" fill="#993C1D">faltantes</text>
  <text x="54" y="824" text-anchor="middle" font-size="10" fill="#993C1D">→ compra</text>

  <!-- Fase 5 -->
  <rect x="10" y="1148" width="88" height="160" rx="4" fill="#E1F5EE" stroke="#9FE1CB" stroke-width="0.5"/>
  <text x="54" y="1192" text-anchor="middle" font-size="11" font-weight="500" fill="#085041">Fase 5</text>
  <text x="54" y="1208" text-anchor="middle" font-size="10" fill="#0F6E56">Cierre</text>


  <!-- ══════════════════════════════════════════════
       BLOQUE 1 — INICIO
  ══════════════════════════════════════════════ -->
  <!-- Inicio -->
  <g class="node-btn" data-tip="Punto de partida del flujo." onclick="sendPrompt('¿Cómo se inicia una orden de servicio en el sistema?')">
    <rect x="240" y="28" width="200" height="36" rx="18" fill="#5F5E5A" stroke="#444441" stroke-width="0.5"/>
    <text x="340" y="50" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#F1EFE8">Inicio</text>
  </g>

  <!-- Flecha inicio → crear orden -->
  <line x1="340" y1="64" x2="340" y2="84" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- BLOQUE: Crear orden -->
  <g class="node-btn" data-tip="El empleado registra folio, solicitante, ubicación, tipo, descripción, prioridad y materiales requeridos." onclick="sendPrompt('¿Qué campos se llenan al crear una orden de servicio?')">
    <rect x="180" y="86" width="320" height="56" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
    <text x="340" y="108" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#0C447C">Crear orden de servicio</text>
    <text x="340" y="128" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5">Folio · Solicitante · Área · Tipo · Prioridad</text>
  </g>

  <!-- Estado: Nueva -->
  <rect x="268" y="152" width="144" height="24" rx="4" fill="#D3D1C7" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="340" y="164" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#2C2C2A">Estado: Nueva</text>

  <!-- Flecha → revisión -->
  <line x1="340" y1="176" x2="340" y2="200" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>


  <!-- ══════════════════════════════════════════════
       BLOQUE 2 — VALIDACIÓN MANUAL
  ══════════════════════════════════════════════ -->
  <g class="node-btn" data-tip="El encargado de mantenimiento revisa la orden antes de proceder al contraste." onclick="sendPrompt('¿Quién valida la orden y qué revisa?')">
    <rect x="180" y="202" width="320" height="56" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
    <text x="340" y="224" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#085041">Aprobación manual</text>
    <text x="340" y="244" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">Encargado toma y revisa la orden</text>
  </g>

  <!-- Estado: En revisión -->
  <rect x="256" y="268" width="168" height="24" rx="4" fill="#D3D1C7" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="340" y="280" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#2C2C2A">Estado: En revisión</text>

  <!-- ¿Tiene materiales? -->
  <line x1="340" y1="292" x2="340" y2="316" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <g class="node-btn" data-tip="Si la orden no tiene materiales requeridos, no se puede realizar el contraste." onclick="sendPrompt('¿Qué pasa si una orden no tiene materiales registrados?')">
    <polygon points="340,318 440,352 340,386 240,352" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
    <text x="340" y="348" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#633806">¿Tiene materiales</text>
    <text x="340" y="363" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#633806">requeridos?</text>
  </g>

  <!-- No → cancelar / pedir corrección -->
  <line x1="240" y1="352" x2="140" y2="352" stroke="#A32D2D" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="102" y="332" width="36" height="20" rx="3" fill="none"/>
  <text x="188" y="344" text-anchor="middle" font-size="10" fill="#A32D2D">No</text>

  <rect x="104" y="362" width="34" height="18" rx="3" fill="#FCEBEB" stroke="#E24B4A" stroke-width="0.5"/>
  <text x="121" y="374" text-anchor="middle" dominant-baseline="central" font-size="9" fill="#791F1F">Corregir</text>
  <line x1="121" y1="372" x2="121" y2="388" stroke="#A32D2D" stroke-width="0.8"/>
  <path d="M121 388 C121 410 180 400 180 352" fill="none" stroke="#A32D2D" stroke-width="0.8" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- Sí → contraste -->
  <line x1="340" y1="386" x2="340" y2="408" stroke="#3B6D11" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="352" y="400" font-size="10" fill="#3B6D11">Sí</text>


  <!-- ══════════════════════════════════════════════
       BLOQUE 3 — CONTRASTE DE MATERIALES
  ══════════════════════════════════════════════ -->
  <g class="node-btn" data-tip="Se compara cada material requerido contra el inventario disponible. Faltante = max(0, requerido − disponible)." onclick="sendPrompt('¿Cómo funciona el contraste de materiales?')">
    <rect x="180" y="410" width="320" height="56" rx="4" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
    <text x="340" y="432" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#27500A">Contrastar con inventario</text>
    <text x="340" y="452" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#3B6D11">faltante = max(0, requerido − disponible)</text>
  </g>

  <!-- ¿Hay faltantes? -->
  <line x1="340" y1="466" x2="340" y2="490" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <g class="node-btn" data-tip="Si no hay faltantes, la orden puede ejecutarse directamente. Si hay faltantes, se genera una solicitud de compra." onclick="sendPrompt('¿Qué sucede cuando hay materiales faltantes?')">
    <polygon points="340,492 450,530 340,568 230,530" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
    <text x="340" y="525" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#633806">¿Hay materiales</text>
    <text x="340" y="542" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#633806">faltantes?</text>
  </g>

  <!-- ══════════════════════════════════════════════
       RAMA A — SIN FALTANTES (izquierda)
  ══════════════════════════════════════════════ -->
  <!-- No → rama izquierda -->
  <path d="M230 530 L180 530 L180 578" fill="none" stroke="#0F6E56" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="196" y="524" font-size="10" fill="#0F6E56">No</text>

  <!-- Estado contrastada sin faltantes -->
  <rect x="110" y="580" width="140" height="40" rx="4" fill="#D3D1C7" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="180" y="596" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#2C2C2A">Estado: Contrastada</text>
  <text x="180" y="612" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#2C2C2A">sin faltantes</text>

  <!-- Aprobación manual → lista para realizar -->
  <line x1="180" y1="620" x2="180" y2="644" stroke="#0F6E56" stroke-width="1" marker-end="url(#arrow)"/>

  <g class="node-btn" data-tip="El encargado confirma que todos los materiales están disponibles y autoriza la ejecución del servicio." onclick="sendPrompt('¿Quién aprueba que la orden está lista para realizar?')">
    <rect x="110" y="646" width="140" height="44" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
    <text x="180" y="664" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#085041">Aprobación manual</text>
    <text x="180" y="680" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#0F6E56">Confirmar ejecución</text>
  </g>

  <!-- Estado lista para realizar -->
  <line x1="180" y1="690" x2="180" y2="710" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="110" y="712" width="140" height="24" rx="4" fill="#D3D1C7" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="180" y="724" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#2C2C2A">Estado: Lista para realizar</text>

  <!-- Convergencia hacia Ejecutar servicio -->
  <line x1="180" y1="736" x2="180" y2="1150" stroke="#0F6E56" stroke-width="1" stroke-dasharray="5 3"/>
  <line x1="180" y1="1150" x2="260" y2="1150" stroke="#0F6E56" stroke-width="1" marker-end="url(#arrow)"/>


  <!-- ══════════════════════════════════════════════
       RAMA B — CON FALTANTES (derecha)
  ══════════════════════════════════════════════ -->
  <!-- Sí → rama derecha -->
  <path d="M450 530 L500 530 L500 580" fill="none" stroke="#993C1D" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="462" y="524" font-size="10" fill="#993C1D">Sí</text>

  <!-- Estado: En espera de materiales -->
  <rect x="430" y="580" width="140" height="40" rx="4" fill="#D3D1C7" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="500" y="596" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#2C2C2A">Estado: En espera</text>
  <text x="500" y="612" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#2C2C2A">de materiales</text>

  <!-- Generar solicitud de compra -->
  <line x1="500" y1="620" x2="500" y2="644" stroke="#993C1D" stroke-width="1" marker-end="url(#arrow)"/>

  <g class="node-btn" data-tip="Se genera una solicitud de compra con folio propio. Hereda solicitante, área y tipo de servicio de la orden." onclick="sendPrompt('¿Qué datos contiene una solicitud de compra?')">
    <rect x="430" y="646" width="140" height="56" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
    <text x="500" y="668" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#4A1B0C">Generar solicitud</text>
    <text x="500" y="686" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#993C1D">de compra (SC-XXX)</text>
  </g>

  <!-- Estado solicitud: Pendiente -->
  <line x1="500" y1="702" x2="500" y2="726" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="430" y="728" width="140" height="24" rx="4" fill="#D3D1C7" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="500" y="740" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#2C2C2A">SC Estado: Pendiente</text>

  <!-- Gestionar compra -->
  <line x1="500" y1="752" x2="500" y2="776" stroke="#993C1D" stroke-width="1" marker-end="url(#arrow)"/>

  <g class="node-btn" data-tip="El encargado gestiona la compra de los materiales faltantes con proveedores." onclick="sendPrompt('¿Cómo se gestiona la compra de materiales?')">
    <rect x="430" y="778" width="140" height="44" rx="4" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
    <text x="500" y="796" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#4A1B0C">Gestionar compra</text>
    <text x="500" y="812" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#993C1D">Contacto con proveedor</text>
  </g>

  <!-- Estado: Comprado -->
  <line x1="500" y1="822" x2="500" y2="846" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="430" y="848" width="140" height="24" rx="4" fill="#D3D1C7" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="500" y="860" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#2C2C2A">SC Estado: Comprado</text>

  <!-- Recibir materiales -->
  <line x1="500" y1="872" x2="500" y2="896" stroke="#993C1D" stroke-width="1" marker-end="url(#arrow)"/>

  <g class="node-btn" data-tip="El encargado recibe los materiales físicamente y marca la solicitud como Recibido." onclick="sendPrompt('¿Qué pasa cuando llegan los materiales?')">
    <rect x="430" y="898" width="140" height="44" rx="4" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
    <text x="500" y="916" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#4A1B0C">Marcar como recibido</text>
    <text x="500" y="932" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#993C1D">Verificación física</text>
  </g>

  <!-- Estado: Recibido -->
  <line x1="500" y1="942" x2="500" y2="966" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="430" y="968" width="140" height="24" rx="4" fill="#D3D1C7" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="500" y="980" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#2C2C2A">SC Estado: Recibido</text>

  <!-- Actualizar inventario manualmente -->
  <line x1="500" y1="992" x2="500" y2="1016" stroke="#3B6D11" stroke-width="1" marker-end="url(#arrow)"/>

  <g class="node-btn" data-tip="El encargado actualiza cantidadDisponible en el inventario. La reserva se libera." onclick="sendPrompt('¿Cómo se actualiza el inventario al recibir materiales?')">
    <rect x="430" y="1018" width="140" height="44" rx="4" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
    <text x="500" y="1036" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#27500A">Actualizar inventario</text>
    <text x="500" y="1052" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#3B6D11">Manual · liberar reserva</text>
  </g>

  <!-- Aprobación final rama B -->
  <line x1="500" y1="1062" x2="500" y2="1086" stroke="#0F6E56" stroke-width="1" marker-end="url(#arrow)"/>

  <g class="node-btn" data-tip="Tras recibir materiales el encargado cambia el estado a Lista para realizar." onclick="sendPrompt('¿Quién cambia el estado de la orden tras recibir los materiales?')">
    <rect x="430" y="1088" width="140" height="44" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
    <text x="500" y="1106" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#085041">Aprobación manual</text>
    <text x="500" y="1122" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#0F6E56">Materiales completos</text>
  </g>

  <!-- Convergencia rama B hacia ejecución -->
  <line x1="500" y1="1132" x2="500" y2="1150" stroke="#0F6E56" stroke-width="1"/>
  <line x1="500" y1="1150" x2="420" y2="1150" stroke="#0F6E56" stroke-width="1" marker-end="url(#arrow)"/>


  <!-- ══════════════════════════════════════════════
       BLOQUE 5 — CIERRE
  ══════════════════════════════════════════════ -->

  <!-- Estado lista para realizar (convergencia) -->
  <rect x="256" y="1154" width="168" height="24" rx="4" fill="#D3D1C7" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="340" y="1166" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#2C2C2A">Estado: Lista para realizar</text>

  <!-- Ejecutar servicio -->
  <line x1="340" y1="1178" x2="340" y2="1202" stroke="#0F6E56" stroke-width="1" marker-end="url(#arrow)"/>

  <g class="node-btn" data-tip="El técnico ejecuta el servicio en campo." onclick="sendPrompt('¿Quién ejecuta el servicio de mantenimiento?')">
    <rect x="200" y="1204" width="280" height="44" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
    <text x="340" y="1222" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#085041">Ejecutar servicio</text>
    <text x="340" y="1240" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">Técnico realiza el trabajo en campo</text>
  </g>

  <!-- Cerrar orden -->
  <line x1="340" y1="1248" x2="340" y2="1272" stroke="#0F6E56" stroke-width="1" marker-end="url(#arrow)"/>

  <g class="node-btn" data-tip="El encargado cierra la orden cambiando el estado a Terminada." onclick="sendPrompt('¿Cómo se cierra una orden de servicio?')">
    <rect x="200" y="1274" width="280" height="44" rx="4" fill="#E1F5EE" stroke="#085041" stroke-width="1"/>
    <text x="340" y="1292" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#085041">Cerrar orden</text>
    <text x="340" y="1310" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#0F6E56">Encargado confirma finalización</text>
  </g>

<div class="tooltip" id="tip"></div>

<script>
const tip = document.getElementById('tip');
let lastTarget = null;

document.querySelectorAll('[data-tip]').forEach(el => {
  el.addEventListener('mouseenter', (e) => {
    tip.textContent = el.dataset.tip;
    tip.classList.add('visible');
    lastTarget = el;
  });
  el.addEventListener('mousemove', (e) => {
    let x = e.clientX + 14, y = e.clientY + 14;
    if (x + 230 > window.innerWidth) x = e.clientX - 230;
    if (y + 80 > window.innerHeight) y = e.clientY - 80;
    tip.style.left = x + 'px';
    tip.style.top = y + 'px';
  });
  el.addEventListener('mouseleave', () => {
    tip.classList.remove('visible');
    lastTarget = null;
  });
});
</script>
