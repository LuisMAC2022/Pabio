<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pabio | Simulación de validación de ID</title>
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/a11y.css">
</head>
<body>
  <a class="skip-link" href="#contenido">Saltar al contenido principal</a>
  <main id="contenido" class="container">
    <h1>Simulacion de validacion de ID</h1>
    <form id="login-form" novalidate>
      <label for="id-input">Ingresa tu ID</label>
      <input
        id="id-input"
        name="id"
        type="text"
        inputmode="numeric"
        autocomplete="off"
        required
        aria-describedby="id-help id-error"
      >
      <p id="id-help">Usa solo números. También puedes ingresar con ceros a la izquierda.</p>
      <button type="submit">Continuar</button>
      <p id="id-error" role="alert" aria-live="polite" tabindex="-1"></p>
    </form>
  </main>

  <script>
    (() => {
      const form = document.getElementById('login-form');
      const idInput = document.getElementById('id-input');
      const errorBox = document.getElementById('id-error');

      const showError = (message, focusTarget = errorBox) => {
        errorBox.textContent = message;
        focusTarget.focus();
      };

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        errorBox.textContent = '';

        const raw = idInput.value.trim();
        if (!/^\d+$/.test(raw)) {
          showError('Ingresa un ID numérico válido.', idInput);
          return;
        }

        const normalized = raw.replace(/^0+/, '') || '0';

        try {
          const response = await fetch('data/directorio.json', { cache: 'no-store' });
          if (!response.ok) {
            showError('No se pudo validar el ID. Intenta nuevamente.');
            return;
          }

          const directory = await response.json();
          const entries = Array.isArray(directory)
            ? directory
            : Array.isArray(directory?.registros)
              ? directory.registros
              : [];
          const match = entries.find((entry) => String(entry.id_fuente) === normalized);

          if (!match) {
            showError('ID no encontrado.', idInput);
            return;
          }

          sessionStorage.setItem('pabioLoginUser', JSON.stringify({
            id: normalized,
            nombre: String(match.nombre || '').trim()
          }));

          window.location.assign('pages/index.html');
        } catch {
          showError('Error de red al consultar el directorio.');
        }
      });
    })();
  </script>
</body>
</html>
